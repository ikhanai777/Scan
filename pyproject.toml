[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptosignal"
version = "0.1.0"
description = "Crypto market scanner that ranks live setups and issues long/short calls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["crypto", "trading", "signals", "technical-analysis", "scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]

# The scanner core: market data, indicator maths, persistence and alerts.
dependencies = [
    "ccxt>=4.2",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The dashboard and its API. A worker that only scans and alerts to Telegram
# does not need a web framework installed.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
cryptosignal = "cryptosignal.cli:main"

[tool.setuptools.packages.find]
include = ["cryptosignal*"]

[tool.setuptools.package-data]
cryptosignal = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
